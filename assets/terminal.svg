<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" role="img" aria-label="Terminal: pdf-sanitizer refuses invoice.pdf.exe as a program, then makes invoice.safe.pdf from invoice.pdf">
  <style>
    text { font: 400 14.5px ui-monospace, "Cascadia Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; fill: #e2e8f0; white-space: pre; }
    .p { fill: #4ade80; }
    .c { fill: #ffffff; font-weight: 700; }
    .w { fill: #fbbf24; }
    .r { fill: #f87171; }
    .g { fill: #4ade80; }
    .d { fill: #94a3b8; }
  </style>
  <rect width="780" height="340" rx="12" fill="#0f172a"/>
  <rect width="780" height="36" rx="12" fill="#1e293b"/>
  <rect y="24" width="780" height="12" fill="#1e293b"/>
  <circle cx="22" cy="18" r="6" fill="#ef4444"/>
  <circle cx="42" cy="18" r="6" fill="#f59e0b"/>
  <circle cx="62" cy="18" r="6" fill="#22c55e"/>
  <text x="20" y="70"><tspan class="p">$</tspan> <tspan class="c">pdf-sanitizer check invoice.pdf.exe</tspan></text>
  <text x="20" y="94">invoice.pdf.exe: Windows program (.exe, .dll or .scr)</text>
  <text x="20" y="118" class="w">  warning: Double ending: it looks like '.pdf' but really ends in '.exe'.</text>
  <text x="20" y="142" class="r">  It is a program, not a document. Do not open it. Delete it.</text>
  <text x="20" y="190"><tspan class="p">$</tspan> <tspan class="c">pdf-sanitizer invoice.pdf</tspan></text>
  <text x="20" y="214">invoice.pdf: PDF document</text>
  <text x="20" y="238" class="d">  Real document. It can be sanitized.</text>
  <text x="20" y="262" class="g">  Safe copy: invoice.safe.pdf (3 pages, 0.3 MB, 7 s)</text>
  <text x="20" y="310">1 of 1 sanitized.</text>
</svg>
